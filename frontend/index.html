<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pesan makanan atau minuman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary-light': '#D5B99F',
              'dark': '#1A110A',
              'gray-500': '#5C4A3D',
              'gray-800': '#2C1E16',
            },
            fontFamily: {
              'sans': ['"Plus Jakarta Sans"', 'sans-serif'],
              'serif': ['"Playfair Display"', 'serif'],
            }
          }
        }
      }
    </script>
</head>

<body class="font-sans text-gray-800 bg-[#D5B99F] antialiased min-h-screen bg-[radial-gradient(circle_at_10%_20%,rgba(255,255,255,0.15)_0%,transparent_40%),radial-gradient(circle_at_90%_80%,rgba(255,255,255,0.15)_0%,transparent_40%)]">
    
    <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col lg:flex-row gap-12 relative min-h-screen">
        
        <main class="flex flex-col items-center w-full flex-1">
            <h1 class="font-serif text-4xl md:text-5xl lg:text-6xl font-extrabold text-[#1A110A] mb-2 tracking-tight capitalize">Menu</h1>
            <p class="text-xs md:text-sm font-medium text-[#5C4A3D] mb-6 md:mb-8 text-center px-4">Pesan langsung dari meja kamu</p>
            
            <div class="w-full max-w-2xl mb-6 md:mb-8 relative px-4 md:px-0">
                <input id="input-pencarian" type="text" class="w-full px-5 py-3 md:px-6 md:py-4 rounded-full border border-white/40 bg-white/70 text-sm md:text-base text-gray-800 outline-none transition-all shadow-md focus:bg-white focus:border-[#5C4A3D]" placeholder="Cari makanan, minuman...">
            </div>
            
            <div id="filter-container" class="flex gap-5 md:gap-8 mb-8 md:mb-12 overflow-x-auto whitespace-nowrap flex-nowrap md:justify-center text-sm md:text-base px-4 md:px-0 w-full max-w-2xl" style="scrollbar-width: none;">
                <button class="text-[#1A110A] font-bold border-b-2 border-[#1A110A] pb-1 transition-all shrink-0" data-kategori="All">All</button>
                <button class="text-[#5C4A3D] font-medium hover:text-[#1A110A] transition-all pb-1 shrink-0" data-kategori="Makanan" id="makanan-btn">Makanan</button>
                <button class="text-[#5C4A3D] font-medium hover:text-[#1A110A] transition-all pb-1 shrink-0" data-kategori="Minuman" id="minuman-btn">Minuman</button>
                <button class="text-[#5C4A3D] font-medium hover:text-[#1A110A] transition-all pb-1 shrink-0" data-kategori="Snack" id="snack-btn">Snack</button>
            </div>

            <div id="menu-container" class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6 w-full max-w-5xl px-2 md:px-0">
            </div>

            <div id="empty-state" class="hidden flex-col items-center justify-center w-full py-12 text-center">
                <h3 class="font-serif text-xl md:text-2xl font-bold text-[#1A110A] mb-2">Yang kamu cari tidak ditemukan</h3>
                <p class="text-sm md:text-base text-[#5C4A3D]">Pastikan pencarian kamu benar ya..</p>
            </div>

            <div id="loading-state" class="hidden flex-col items-center justify-center w-full py-16 text-center">
                <div class="w-10 h-10 md:w-12 md:h-12 border-4 border-[#5C4A3D]/20 border-t-[#1A110A] rounded-full animate-spin mb-4"></div>
                <h3 class="font-serif text-base md:text-lg font-bold text-[#1A110A]">Sedang memuat data...</h3>
            </div>

            <div id="error-state" class="hidden flex-col items-center justify-center w-full py-12 text-center px-4">
                <h3 class="font-serif text-xl md:text-2xl font-bold text-red-700 mb-20">Gagal Terhubung</h3>
                <button onclick="location.reload()" class="py-2 px-6 text-sm md:text-base bg-[#1A110A] text-[#D5B99F] font-semibold rounded-full hover:bg-gray-800 transition-all shadow-md">Muat Ulang Halaman</button>
            </div>

            <div class="w-full max-w-5xl px-2 md:px-0 flex justify-center mt-6">
                <button id="navigasi" class="py-2 px-6 md:py-2.5 md:px-8 text-sm md:text-base bg-transparent border-2 border-[#1A110A] text-[#1A110A] font-semibold rounded-full hover:bg-[#1A110A] hover:text-[#D5B99F] transition-all duration-300 shadow-sm hover:shadow-md">Lihat Lebih Banyak</button>
            </div>
        </main>

        <aside id="cart-ringkasan" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-48px)] max-w-sm z-50 lg:sticky lg:top-6 lg:transform-none lg:left-auto lg:bottom-auto hidden">
            <div class="flex items-center justify-between bg-[#1A110A] rounded-full p-2 pl-6 shadow-2xl hover:scale-105 transition-transform cursor-pointer">
                
                <div class="flex items-center text-[#D5B99F]">
                    <span id="count" class="text-sm font-semibold tracking-wide">1 Item</span>
                    <span class="mx-3 text-white/30">|</span>
                    <strong id="total" class="text-lg font-bold tracking-wide">Rp 18.000</strong>
                </div>

                <div class="flex items-center justify-center bg-[#D5B99F] w-12 h-12 rounded-full shadow-inner">
                    <span class="text-[#1A110A] font-bold text-lg">➜</span>
                </div>
                
            </div>
        </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
