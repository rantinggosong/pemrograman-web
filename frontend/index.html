<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tailwind.css">
</head>

<body class="font-sans text-gray-800 bg-[#D5B99F] antialiased min-h-screen bg-[radial-gradient(circle_at_10%_20%,rgba(255,255,255,0.15)_0%,transparent_40%),radial-gradient(circle_at_90%_80%,rgba(255,255,255,0.15)_0%,transparent_40%)]">
    
    <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col lg:flex-row gap-12 relative min-h-screen">
        
        <!-- Main Content -->
        <main class="flex flex-col items-center w-full flex-1">
            <h1 id="hallo" class="font-serif text-5xl font-extrabold text-[#1A110A] mb-2 tracking-tight capitalize">Menu</h1>
            <p class="text-sm font-medium text-[#5C4A3D] mb-8">Pesan langsung dari meja kamu</p>
            
            <!-- Search -->
            <div class="w-full max-w-2xl mb-8 relative">
                <input type="text" class="w-full px-6 py-4 rounded-full border border-white/40 bg-white/70 text-sm text-gray-800 outline-none transition-all shadow-md focus:bg-white focus:border-[#5C4A3D]" placeholder="Cari makanan, minuman, atau snack...">
            </div>
            
            <!-- Filter -->
            <div class="flex gap-8 mb-12 flex-wrap justify-center">
                <button class="text-[#1A110A] font-bold border-b-2 border-[#1A110A] pb-1 transition-all">All</button>
                <button class="text-[#5C4A3D] font-medium hover:text-[#1A110A] transition-all pb-1" id="makanan-btn">Makanan</button>
                <button class="text-[#5C4A3D] font-medium hover:text-[#1A110A] transition-all pb-1" id="minuman-btn">Minuman</button>
                <button class="text-[#5C4A3D] font-medium hover:text-[#1A110A] transition-all pb-1" id="snack-btn">Snack</button>
            </div>

            <!-- Card Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-5xl">
                
                <!-- Card 1 -->
                <div class="flex flex-col bg-white/30 border border-[#1A110A]/10 rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition-shadow backdrop-blur-sm">
                    <div class="bg-[#1A110A] p-4">
                        <div class="w-full aspect-square rounded-xl overflow-hidden shadow-inner">
                            <img src="https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=500&q=80" alt="Kopi Cappuccino" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                        </div>
                    </div>
                    <div class="flex flex-col items-center p-6">
                        <h3 class="font-serif text-2xl font-bold text-[#1A110A] mb-6">Cappuccino</h3>
                        <button id="tambah" class="w-full py-3 px-4 bg-transparent border-2 border-[#1A110A]/30 text-[#1A110A] font-semibold rounded-xl hover:bg-[#1A110A] hover:text-[#D5B99F] transition-all duration-300">Order Now</button>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="flex flex-col bg-white/30 border border-[#1A110A]/10 rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition-shadow backdrop-blur-sm">
                    <div class="bg-[#1A110A] p-4">
                        <div class="w-full aspect-square rounded-xl overflow-hidden shadow-inner">
                            <img src="https://images.unsplash.com/photo-1551030173-122aabc4489c?w=500&q=80" alt="Kopi Americano" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                        </div>
                    </div>
                    <div class="flex flex-col items-center p-6">
                        <h3 class="font-serif text-2xl font-bold text-[#1A110A] mb-6">Americano</h3>
                        <button class="w-full py-3 px-4 bg-transparent border-2 border-[#1A110A]/30 text-[#1A110A] font-semibold rounded-xl hover:bg-[#1A110A] hover:text-[#D5B99F] transition-all duration-300">Order Now</button>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="flex flex-col bg-white/30 border border-[#1A110A]/10 rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition-shadow backdrop-blur-sm">
                    <div class="bg-[#1A110A] p-4">
                        <div class="w-full aspect-square rounded-xl overflow-hidden shadow-inner">
                            <img src="https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=500&q=80" alt="Kopi Espresso" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                        </div>
                    </div>
                    <div class="flex flex-col items-center p-6">
                        <h3 class="font-serif text-2xl font-bold text-[#1A110A] mb-6">Espresso</h3>
                        <button class="w-full py-3 px-4 bg-transparent border-2 border-[#1A110A]/30 text-[#1A110A] font-semibold rounded-xl hover:bg-[#1A110A] hover:text-[#D5B99F] transition-all duration-300">Order Now</button>
                    </div>
                </div>

            </div>
        </main>

        <!-- Cart Summary -->
        <aside id="cart-ringkasan" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-48px)] max-w-sm z-50 lg:sticky lg:top-6 lg:transform-none lg:left-auto lg:bottom-auto hidden">
            <div class="flex items-center justify-between bg-[#1A110A] rounded-full p-2 pl-6 shadow-2xl hover:scale-105 transition-transform cursor-pointer">
                
                <div class="flex items-center text-[#D5B99F]">
                    <span id="count" class="text-sm font-semibold tracking-wide">1 Item</span>
                    <span class="mx-3 text-white/30">|</span>
                    <strong id="total" class="text-lg font-bold tracking-wide">Rp 18.000</strong>
                </div>

                <div class="flex items-center justify-center bg-[#D5B99F] w-12 h-12 rounded-full shadow-inner">
                    <span class="text-[#1A110A] font-bold text-lg">➜</span>
                </div>
                
            </div>
        </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
