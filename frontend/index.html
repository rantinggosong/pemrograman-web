<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tugas pemrograman web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
    <h1>menu</h1>
    <p>pesan langsung dari meja kamu</p>
    <div class="card-menu">
        <span class="card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80" alt="makanan">
                <span class="badge">Terlaris</span>
            </div>
            <h3 class="item-name">nasi goreng</h3>
            <span class="deskripsi">ini adalah deskripsi item</span>
            <span class="harga-cart">Rp.10.000</span>
            <button class="tambah" id="tambah">+</button>
        </span>
    </div>

    <div id="cart-ringkasan" class="cart-ringkasan hidden">

        <div class="cart-info">
            <span id="count">1 Item</span>
            <span class="pipe">|</span>
            <strong id="total">Rp 18.000</strong>
        </div>

        <div class="aksi">
            <img src="asset/cart.svg" alt="cart" class="icon-cart">
            <span class="arrow">➜</span>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
